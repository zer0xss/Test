from pathlib import Path

html = '''<!doctype html>

<html lang="ko">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width,initial-scale=1">

<title>사이렌 사운드 패드</title>

<style>

body{margin:0;background:#111;color:#fff;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;min-height:100vh}

.app{width:min(92vw,560px);margin:auto;padding:24px;border-radius:22px;background:#1d1d1f}

h1{margin:0 0 6px}.sub{color:#aaa;margin:0 0 20px;font-size:14px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px}

label,.filebtn{display:block;padding:16px;border:1px solid #555;border-radius:14px;text-align:center;cursor:pointer;background:#333;color:#fff;font-weight:700}

input[type=file]{display:none}

#buttons{display:grid;grid-template-columns:1fr 1fr;gap:12px}

button{border:0;border-radius:14px;padding:22px 10px;font-size:17px;font-weight:700;background:#333;color:white}

button:active{transform:scale(.97)}.stop{background:#8d2222}

.volume{margin-top:20px}.row{display:flex;justify-content:space-between;color:#ccc;margin-bottom:8px}

input[type=range]{width:100%}#status{margin-top:14px;color:#aaa;font-size:13px;min-height:20px}

#names{margin-top:12px;color:#bbb;font-size:13px;line-height:1.7}

.note{margin-top:12px;color:#777;font-size:12px;line-height:1.5}

</style>

</head>

<body>

<div class="app">

<h1>사이렌 사운드 패드</h1>

<p class="sub">파일 앱의 MP3를 선택해서 버튼으로 바로 재생하세요.</p>

<div class="actions">

<label>＋ MP3 추가

<input id="files" type="file" accept=".mp3,audio/mpeg,audio/*" multiple></label>

<label>＋ 파일 앱에서 선택

<input id="files2" type="file" accept=".mp3,audio/mpeg,audio/*" multiple></label>

</div>

<div id="buttons"></div>

<div class="volume">

<div class="row"><span>볼륨</span><span id="vt">100%</span></div>

<input id="vol" type="range" min="0" max="1" step=".01" value="1">

</div>

<div id="status">MP3 파일을 추가하세요.</div>

<div id="names"></div>

<div class="note">※ iPhone에서는 파일 선택 창이 뜨면 「파일」 앱에서 MP3를 선택하세요.</div>

</div>

<script>

let sounds=[],current=null;

const $=id=>document.getElementById(id);

function stop(){

 if(current){current.pause();current.currentTime=0;current=null}

 $('status').textContent='꺼짐';

}

function play(i){

 if(!sounds[i])return;

 stop();

 current=new Audio(sounds[i].url);

 current.volume=+$('vol').value;

 current.play().then(()=>{

   $('status').textContent='재생 중: '+sounds[i].name;

 }).catch(()=>{

   $('status').textContent='재생할 수 없습니다. 버튼을 다시 눌러보세요.';

 });

 current.onended=()=>{

   current=null;

   $('status').textContent='재생 완료';

 };

}

function addFiles(fileList){

 const incoming=[...fileList].filter(f=>{

   const name=f.name.toLowerCase();

   return name.endsWith('.mp3') || f.type==='audio/mpeg' || f.type.startsWith('audio/');

 });

 incoming.forEach(f=>{

   if(sounds.length>=12)return;

   sounds.push({name:f.name,url:URL.createObjectURL(f)});

 });

 render();

}

function render(){

 $('buttons').innerHTML='';

 sounds.forEach((s,i)=>{

   let b=document.createElement('button');

   b.textContent='▶ '+(i+1);

   b.title=s.name;

   b.onclick=()=>play(i);

   $('buttons').appendChild(b);

 });

 let b=document.createElement('button');

 b.textContent='■ 끄기';

 b.className='stop';

 b.onclick=stop;

 $('buttons').appendChild(b);

 $('names').innerHTML=sounds.length

   ? sounds.map((s,i)=>(i+1)+'. '+s.name).join('<br>')

   : '';

 $('status').textContent=sounds.length+'개 준비 완료';

}

$('files').onchange=e=>{addFiles(e.target.files);e.target.value=''};

$('files2').onchange=e=>{addFiles(e.target.files);e.target.value=''};

$('vol').oninput=()=>{

 const v=+$('vol').value;

 $('vt').textContent=Math.round(v*100)+'%';

 if(current)current.volume=v;

};

</script>

</body>

</html>'''

path = Path("/mnt/data/siren_sound_pad_v2.html")

path.write_text(html, encoding="utf-8")

print(path)
