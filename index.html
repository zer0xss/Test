<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Baccarat</title>
<style>
body {
    background: #0b1c2c;
    color: white;
    font-family: Arial;
    text-align: center;
}

h1 {
    margin-top: 20px;
}

.table {
    display: flex;
    justify-content: space-around;
    margin-top: 40px;
}

.area {
    border: 2px solid white;
    padding: 20px;
    width: 40%;
    border-radius: 10px;
}

.cards {
    font-size: 30px;
    margin: 20px;
}

.chips button {
    margin: 5px;
    padding: 10px;
    font-size: 16px;
    cursor: pointer;
}

.bet-area button {
    margin: 10px;
    padding: 10px 20px;
    font-size: 18px;
    cursor: pointer;
}

#log {
    margin-top: 20px;
    height: 100px;
    overflow-y: auto;
    border-top: 1px solid white;
}
</style>
</head>

<body>

<h1>💰 Baccarat</h1>

<div>보유 칩: <span id="cash">1000</span></div>

<div class="chips">
    <button onclick="setBet(10)">10</button>
    <button onclick="setBet(50)">50</button>
    <button onclick="setBet(100)">100</button>
</div>

<div>현재 베팅: <span id="bet">0</span></div>

<div class="bet-area">
    <button onclick="play('P')">Player</button>
    <button onclick="play('B')">Banker</button>
    <button onclick="play('T')">Tie</button>
</div>

<div class="table">
    <div class="area">
        <h2>Player</h2>
        <div class="cards" id="playerCards"></div>
        <div id="playerScore"></div>
    </div>

    <div class="area">
        <h2>Banker</h2>
        <div class="cards" id="bankerCards"></div>
        <div id="bankerScore"></div>
    </div>
</div>

<div id="log"></div>

<script>
let cash = 1000;
let bet = 0;

function updateUI() {
    document.getElementById("cash").innerText = cash;
    document.getElementById("bet").innerText = bet;
}

function setBet(amount) {
    if (amount > cash) {
        alert("칩 부족");
        return;
    }
    bet = amount;
    updateUI();
}

function getCard() {
    const cards = ['A','K','Q','J',2,3,4,5,6,7,8,9];
    return cards[Math.floor(Math.random() * cards.length)];
}

function getValue(card) {
    if (card === 'A') return 1;
    if (['K','Q','J'].includes(card)) return 0;
    return card;
}

function calcScore(arr) {
    let sum = arr.reduce((a,b)=>a+getValue(b),0);
    return sum % 10;
}

function play(choice) {
    if (bet === 0) {
        alert("베팅 먼저");
        return;
    }

    if (bet > cash) {
        alert("칩 부족");
        return;
    }

    cash -= bet;

    let player = [getCard(), getCard()];
    let banker = [getCard(), getCard()];

    // 카드 출력 (약간 애니메이션 느낌)
    document.getElementById("playerCards").innerText = "";
    document.getElementById("bankerCards").innerText = "";

    setTimeout(()=>{
        document.getElementById("playerCards").innerText = player.join(" ");
        document.getElementById("bankerCards").innerText = banker.join(" ");
    }, 500);

    let pScore = calcScore(player);
    let bScore = calcScore(banker);

    document.getElementById("playerScore").innerText = "점수: " + pScore;
    document.getElementById("bankerScore").innerText = "점수: " + bScore;

    let result = "";
    if (pScore > bScore) result = 'P';
    else if (bScore > pScore) result = 'B';
    else result = 'T';

    setTimeout(()=>{
        if (choice === result) {
            cash += bet * 2;
            log("승리 🎉 (" + result + ")");
        } else {
            log("패배 💀 (" + result + ")");
        }

        bet = 0;
        updateUI();

        if (cash <= 0) {
            alert("파산 💀 게임 종료");
        }
    }, 1000);
}

function log(text) {
    const el = document.getElementById("log");
    el.innerHTML += text + "<br>";
    el.scrollTop = el.scrollHeight;
}

updateUI();
</script>

</body>
</html>
