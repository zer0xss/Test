<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>사이렌 사운드 패드</title>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
touch-action:manipulation;
}

html,body{
margin:0;
min-height:100%;
background:#111;
color:#fff;
}

body{
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
padding:20px;
}

.app{
width:100%;
max-width:560px;
margin:0 auto;
padding:22px;
border-radius:22px;
background:#1d1d1f;
box-shadow:0 10px 35px #0008;
}

.login-wrap{
width:100%;
max-width:420px;
margin:auto;
min-height:calc(100vh - 40px);
display:flex;
align-items:center;
}

.login{
width:100%;
padding:28px;
border-radius:22px;
background:#1d1d1f;
box-shadow:0 10px 35px #0008;
}

.login h1{
margin:0 0 7px;
font-size:27px;
}

.login-sub{
margin:0 0 25px;
color:#999;
font-size:14px;
}

.input{
width:100%;
height:52px;
margin-bottom:11px;
padding:0 15px;
border:1px solid #444;
border-radius:13px;
outline:none;
background:#292929;
color:#fff;
font-size:16px;
}

.input:focus{
border-color:#777;
}

.login-btn{
width:100%;
height:52px;
margin-top:5px;
border:0;
border-radius:13px;
background:#fff;
color:#111;
font-size:16px;
font-weight:700;
cursor:pointer;
}

.login-btn:active{
transform:scale(.98);
}

.login-error{
height:20px;
margin-top:12px;
text-align:center;
font-size:13px;
color:#ff6b6b;
}

.login-version{
margin-top:20px;
text-align:center;
font-size:10px;
color:#555;
}

h1{
margin:0 0 6px;
font-size:27px;
}

.version{
font-size:10px;
color:#666;
font-weight:400;
margin-left:5px;
}

.sub{
color:#aaa;
margin:0 0 20px;
font-size:14px;
}

.actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:10px;
margin-bottom:18px;
}

.filebtn{
display:flex;
align-items:center;
justify-content:center;
min-height:56px;
padding:14px;
border:1px solid #555;
border-radius:14px;
text-align:center;
cursor:pointer;
background:#333;
color:#fff;
font-weight:700;
}

input[type=file]{
display:none;
}

#buttons{
display:grid;
grid-template-columns:1fr;
gap:10px;
}

.sound-row{
display:grid;
grid-template-columns:1fr 88px 55px;
gap:7px;
}

.sound-btn{
width:100%;
min-height:68px;
border:0;
border-radius:14px;
padding:15px 10px;
font-size:16px;
font-weight:700;
background:#333;
color:#fff;
cursor:pointer;
overflow:hidden;
}

.sound-btn.active{
background:#176b35;
box-shadow:0 0 0 2px #2ee66b inset;
}

.sound-btn:active{
transform:scale(.97);
}

.sound-btn:disabled{
opacity:.5;
cursor:default;
}

.stop{
background:#8d2222;
}

.delete{
background:#444;
color:#ddd;
font-size:13px;
padding:8px 4px;
}

.all-stop{
margin-top:2px;
}

.individual-volume{
grid-column:1/-1;
display:flex;
align-items:center;
gap:9px;
padding:4px 4px 3px;
}

.individual-volume-label{
font-size:11px;
color:#888;
white-space:nowrap;
}

.individual-volume-value{
font-size:11px;
color:#888;
width:35px;
text-align:right;
}

.individual-volume input{
width:100%;
margin:0;
}

.volume{
margin-top:20px;
}

.row{
display:flex;
justify-content:space-between;
color:#ccc;
margin-bottom:8px;
}

input[type=range]{
width:100%;
}

#status{
margin-top:14px;
color:#aaa;
font-size:13px;
min-height:20px;
}

#names{
margin-top:12px;
color:#bbb;
font-size:13px;
line-height:1.7;
word-break:break-all;
}

.note{
margin-top:12px;
color:#777;
font-size:12px;
line-height:1.5;
}

.empty{
color:#777;
text-align:center;
padding:25px 5px;
}

.hidden{
display:none !important;
}

@media(max-width:400px){

body{
padding:12px;
}

.app{
padding:17px;
border-radius:18px;
}

.actions{
gap:8px;
}

.filebtn{
font-size:14px;
}

.sound-btn{
font-size:14px;
}

.sound-row{
grid-template-columns:1fr 78px 52px;
gap:5px;
}

.login-wrap{
min-height:calc(100vh - 24px);
}

.login{
padding:23px;
}

}
</style>
</head>

<body>

<!-- 로그인 -->

<div id="loginScreen" class="login-wrap">

<div class="login">

<h1>login</h1>

<p class="login-sub">

</p>

<input
id="loginId"
class="input"
type="text"
placeholder="Username"
autocomplete="username"
>

<input
id="loginPw"
class="input"
type="password"
placeholder="Password"
autocomplete="current-password"
>

<button id="loginBtn" class="login-btn">
login
</button>

<div id="loginError" class="login-error"></div>

<div class="login-version">
v1.1.9
</div>

</div>

</div>


<!-- 메인 -->

<div id="mainApp" class="app hidden">

<h1>
사이렌 사운드 패드
<span class="version">v1.1.9</span>
</h1>

<p class="sub">
파일 앱의 MP3를 선택해서 여러 소리를 동시에 재생하세요.
</p>

<div class="actions">

<label class="filebtn">
＋ MP3 추가
<input
id="files"
type="file"
accept=".mp3,audio/mpeg,audio/*"
multiple
>
</label>

<label class="filebtn">
＋ 파일 앱에서 선택
<input
id="files2"
type="file"
accept=".mp3,audio/mpeg,audio/*"
multiple
>
</label>

</div>

<div id="buttons">
<div class="empty">
MP3 파일을 추가하세요.
</div>
</div>

<div class="volume">

<div class="row">
<span>전체 볼륨</span>
<span id="vt">100%</span>
</div>

<input
id="vol"
type="range"
min="0"
max="1"
step=".01"
value="1"
>

</div>

<div id="status">
MP3 파일을 추가하세요.
</div>

<div id="names"></div>

<div class="note">
※ 재생 버튼을 누를 때마다 해당 소리가 처음부터 다시 재생됩니다.<br>
※ 여러 소리를 동시에 재생할 수 있습니다.<br>
※ 각 음원 아래의 볼륨으로 해당 음원만 조절할 수 있습니다.<br>
※ 「■ 끄기」는 해당 소리만 즉시 끕니다.<br>
※ 「삭제」는 해당 파일을 저장된 목록에서도 삭제합니다.<br>
※ 「■ 모두 끄기」는 모든 소리를 즉시 끕니다.
</div>

</div>


<script>

/* =========================================
   로그인
========================================= */

const LOGIN_ID = "7yznv.o";
const LOGIN_PASSWORD = "Lsj147214!";

const loginScreen =
    document.getElementById("loginScreen");

const mainApp =
    document.getElementById("mainApp");

const loginId =
    document.getElementById("loginId");

const loginPw =
    document.getElementById("loginPw");

const loginBtn =
    document.getElementById("loginBtn");

const loginError =
    document.getElementById("loginError");


function showMainApp(){

    loginScreen.classList.add("hidden");
    mainApp.classList.remove("hidden");

}


function login(){

    const id =
        loginId.value;

    const password =
        loginPw.value;


    if(
        id === LOGIN_ID &&
        password === LOGIN_PASSWORD
    ){

        sessionStorage.setItem(
            "siren_logged_in",
            "true"
        );

        showMainApp();

        loginError.textContent="";
        loginId.value="";
        loginPw.value="";

    }else{

        loginError.textContent=
            "아이디 또는 비밀번호가 올바르지 않습니다.";

        loginPw.value="";
        loginPw.focus();

    }

}


loginBtn.addEventListener(
    "click",
    login
);


loginPw.addEventListener(
    "keydown",
    e=>{

        if(e.key==="Enter"){
            login();
        }

    }
);


/*
   중요:
   여기서는 loginId.focus()를 호출하지 않는다.
   따라서 사이트에 들어왔을 때
   키보드가 자동으로 뜨지 않는다.
*/

if(
    sessionStorage.getItem(
        "siren_logged_in"
    ) === "true"
){

    showMainApp();

}


/* =========================================
   IndexedDB
========================================= */

let db=null;


function openDatabase(){

    return new Promise((resolve,reject)=>{

        const request =
            indexedDB.open(
                "SirenSoundPadDB",
                1
            );


        request.onupgradeneeded=e=>{

            const database =
                e.target.result;


            if(
                !database.objectStoreNames.contains(
                    "sounds"
                )
            ){

                database.createObjectStore(
                    "sounds",
                    {
                        keyPath:"id",
                        autoIncrement:true
                    }
                );

            }

        };


        request.onsuccess=e=>{

            db=e.target.result;

            resolve(db);

        };


        request.onerror=()=>{

            reject(
                request.error
            );

        };

    });

}


async function saveSoundToDB(sound){

    if(!db)return;


    return new Promise(
        (resolve,reject)=>{

            const transaction =
                db.transaction(
                    "sounds",
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    "sounds"
                );


            const request =
                store.add({

                    name:sound.name,

                    data:sound.data

                });


            request.onsuccess=()=>{

                sound.id=
                    request.result;

                resolve();

            };


            request.onerror=()=>{

                reject(
                    request.error
                );

            };

        }
    );

}


async function deleteSoundFromDB(id){

    if(!db || id==null)
        return;


    return new Promise(
        (resolve,reject)=>{

            const transaction =
                db.transaction(
                    "sounds",
                    "readwrite"
                );


            const store =
                transaction.objectStore(
                    "sounds"
                );


            const request =
                store.delete(id);


            request.onsuccess=
                ()=>resolve();

            request.onerror=
                ()=>reject(
                    request.error
                );

        }
    );

}


async function loadSoundsFromDB(){

    if(!db)return;


    return new Promise(
        (resolve,reject)=>{

            const transaction =
                db.transaction(
                    "sounds",
                    "readonly"
                );


            const store =
                transaction.objectStore(
                    "sounds"
                );


            const request =
                store.getAll();


            request.onsuccess=async()=>{

                const saved =
                    request.result || [];


                for(const item of saved){

                    try{

                        const ctx =
                            await getAudioContext();


                        const buffer =
                            await ctx.decodeAudioData(
                                item.data.slice(0)
                            );


                        sounds.push({

                            id:item.id,

                            name:item.name,

                            data:item.data,

                            buffer:buffer,

                            source:null,

                            gain:null,

                            active:false,

                            loading:false,

                            error:false,

                            individualVolume:1

                        });

                    }catch(error){

                        console.error(
                            "저장된 파일 로드 실패:",
                            error
                        );

                    }

                }


                render();
                updateStatus();

                resolve();

            };


            request.onerror=()=>{

                reject(
                    request.error
                );

            };

        }
    );

}


/* =========================================
   사이렌
========================================= */

const sounds=[];

const $=id=>
    document.getElementById(id);

let audioContext=null;


function getAudioContext(){

    if(!audioContext){

        const AudioContextClass =
            window.AudioContext ||
            window.webkitAudioContext;


        audioContext =
            new AudioContextClass();

    }


    return audioContext;

}


async function unlockAudio(){

    const ctx =
        getAudioContext();


    if(ctx.state === "suspended"){

        try{
            await ctx.resume();
        }catch(e){}

    }


    return ctx;

}


/* =========================================
   재생
========================================= */

async function playSound(i){

    const s=sounds[i];

    if(!s || !s.buffer || s.loading)
        return;


    const ctx =
        await unlockAudio();


    if(s.source){

        try{
            s.source.stop(0);
        }catch(e){}


        try{
            s.source.disconnect();
        }catch(e){}


        s.source=null;

    }


    const source =
        ctx.createBufferSource();


    source.buffer =
        s.buffer;


    const gain =
        ctx.createGain();


    /*
       전체 볼륨 × 개별 볼륨
    */

    gain.gain.value =
        Number($("vol").value) *
        Number(s.individualVolume ?? 1);


    s.gain=gain;


    source.connect(gain);

    gain.connect(
        ctx.destination
    );


    source.onended=()=>{

        if(s.source===source){

            s.source=null;
            s.gain=null;
            s.active=false;

            render();
            updateStatus();

        }

    };


    s.source=source;
    s.active=true;


    source.start(0);


    render();
    updateStatus();

}


/* =========================================
   개별 정지
========================================= */

function stopSound(i){

    const s=sounds[i];

    if(!s)return;


    if(s.source){

        try{
            s.source.stop(0);
        }catch(e){}


        try{
            s.source.disconnect();
        }catch(e){}


        s.source=null;

    }


    s.gain=null;
    s.active=false;


    render();
    updateStatus();

}


/* =========================================
   개별 볼륨
========================================= */

function setIndividualVolume(i,value){

    const s=sounds[i];

    if(!s)return;


    s.individualVolume =
        Number(value);


    /*
       현재 재생 중이면 즉시 반영
    */

    if(s.gain){

        s.gain.gain.value =
            Number($("vol").value) *
            s.individualVolume;

    }


    const valueElement =
        document.getElementById(
            "individualValue-"+i
        );


    if(valueElement){

        valueElement.textContent =
            Math.round(
                s.individualVolume*100
            )+"%";

    }

}


/* =========================================
   삭제
========================================= */

async function deleteSound(i){

    const s=sounds[i];

    if(!s)return;


    if(s.source){

        try{
            s.source.stop(0);
        }catch(e){}


        try{
            s.source.disconnect();
        }catch(e){}


        s.source=null;

    }


    const id=s.id;


    sounds.splice(i,1);


    if(id!=null){

        try{

            await deleteSoundFromDB(id);

        }catch(error){

            console.error(
                "저장된 파일 삭제 실패:",
                error
            );

        }

    }


    render();
    updateStatus();

}


/* =========================================
   모두 끄기
========================================= */

function stopAll(){

    sounds.forEach(s=>{

        if(s.source){

            try{
                s.source.stop(0);
            }catch(e){}


            try{
                s.source.disconnect();
            }catch(e){}


            s.source=null;

        }


        s.gain=null;
        s.active=false;

    });


    render();
    updateStatus();

}


/* =========================================
   파일 추가
========================================= */

async function addFiles(fileList){

    const incoming=
        [...fileList].filter(f=>{

            const name =
                f.name.toLowerCase();


            return(
                name.endsWith(".mp3") ||
                f.type==="audio/mpeg" ||
                f.type.startsWith("audio/")
            );

        });


    if(!incoming.length)
        return;


    const ctx =
        await unlockAudio();


    for(const file of incoming){

        if(sounds.length>=12)
            break;


        const sound={

            id:null,

            name:file.name,

            data:null,

            buffer:null,

            source:null,

            gain:null,

            active:false,

            loading:true,

            error:false,

            individualVolume:1

        };


        sounds.push(sound);


        render();
        updateStatus();


        try{

            const arrayBuffer =
                await file.arrayBuffer();


            sound.data =
                arrayBuffer;


            sound.buffer =
                await ctx.decodeAudioData(
                    arrayBuffer.slice(0)
                );


            sound.loading=false;


            await saveSoundToDB(
                sound
            );


        }catch(error){

            console.error(error);

            sound.loading=false;
            sound.error=true;

        }


        render();
        updateStatus();

    }

}


/* =========================================
   UI
========================================= */

function render(){

    const box =
        $("buttons");


    box.innerHTML="";


    if(!sounds.length){

        box.innerHTML=
            '<div class="empty">MP3 파일을 추가하세요.</div>';

        return;

    }


    sounds.forEach((s,i)=>{

        const row =
            document.createElement("div");


        row.className=
            "sound-row";


        const playButton =
            document.createElement("button");


        playButton.className=
            "sound-btn"+
            (s.active ? " active" : "");


        const displayName =
            s.name.replace(
                /\.[^/.]+$/,
                ""
            );


        if(s.loading){

            playButton.textContent=
                "준비 중 "+displayName;

            playButton.disabled=true;

        }else if(s.error){

            playButton.textContent=
                "오류 "+displayName;

            playButton.disabled=true;

        }else{

            playButton.textContent=
                "▶ "+displayName;

            playButton.onclick=
                ()=>playSound(i);

        }


        playButton.title=
            s.name;


        const offButton =
            document.createElement("button");


        offButton.className=
            "sound-btn stop";


        offButton.textContent=
            "■ 끄기";


        offButton.onclick=
            ()=>stopSound(i);


        const deleteButton =
            document.createElement("button");


        deleteButton.className=
            "sound-btn delete";


        deleteButton.textContent=
            "삭제";


        deleteButton.onclick=
            ()=>deleteSound(i);


        row.appendChild(
            playButton
        );


        row.appendChild(
            offButton
        );


        row.appendChild(
            deleteButton
        );


        box.appendChild(
            row
        );


        /*
           개별 볼륨
        */

        const volumeBox =
            document.createElement("div");


        volumeBox.className=
            "individual-volume";


        const volumeLabel =
            document.createElement("span");


        volumeLabel.className=
            "individual-volume-label";


        volumeLabel.textContent=
            "개별 볼륨";


        const volumeSlider =
            document.createElement("input");


        volumeSlider.type=
            "range";


        volumeSlider.min="0";

        volumeSlider.max="1";

        volumeSlider.step=".01";

        volumeSlider.value=
            s.individualVolume ?? 1;


        const volumeValue =
            document.createElement("span");


        volumeValue.className=
            "individual-volume-value";


        volumeValue.id=
            "individualValue-"+i;


        volumeValue.textContent=
            Math.round(
                (s.individualVolume ?? 1)*100
            )+"%";


        volumeSlider.addEventListener(
            "input",
            e=>{

                setIndividualVolume(
                    i,
                    e.target.value
                );

            }
        );


        volumeBox.appendChild(
            volumeLabel
        );


        volumeBox.appendChild(
            volumeSlider
        );


        volumeBox.appendChild(
            volumeValue
        );


        box.appendChild(
            volumeBox
        );

    });


    const allStop =
        document.createElement("button");


    allStop.className=
        "sound-btn stop all-stop";


    allStop.textContent=
        "■ 모두 끄기";


    allStop.onclick=
        stopAll;


    box.appendChild(
        allStop
    );


    $("names").innerHTML=
        sounds
        .map(
            (s,i)=>
                (i+1)+". "+
                s.name
        )
        .join("<br>");

}


/* =========================================
   상태
========================================= */

function updateStatus(){

    const active =
        sounds.filter(
            s=>s.active
        );


    const loading =
        sounds.filter(
            s=>s.loading
        );


    if(!sounds.length){

        $("status").textContent=
            "MP3 파일을 추가하세요.";

        return;

    }


    if(loading.length){

        $("status").textContent=
            "MP3 준비 중...";

        return;

    }


    if(!active.length){

        $("status").textContent=
            sounds.length+
            "개 준비 완료 · 모두 꺼짐";

        return;

    }


    $("status").textContent=
        "재생 중: "+
        active
        .map(
            s=>s.name
        )
        .join(" + ");

}


/* =========================================
   파일 선택
========================================= */

$("files").addEventListener(
    "change",
    e=>{

        addFiles(
            e.target.files
        );

        e.target.value="";

    }
);


$("files2").addEventListener(
    "change",
    e=>{

        addFiles(
            e.target.files
        );

        e.target.value="";

    }
);


/* =========================================
   전체 볼륨
========================================= */

$("vol").addEventListener(
    "input",
    ()=>{

        const v=
            Number(
                $("vol").value
            );


        $("vt").textContent=
            Math.round(v*100)+
            "%";


        sounds.forEach(s=>{

            if(s.gain){

                s.gain.gain.value=
                    v *
                    Number(
                        s.individualVolume ?? 1
                    );

            }

        });

    }
);


/* =========================================
   시작
========================================= */

render();


(async()=>{

    try{

        await openDatabase();

        await loadSoundsFromDB();

    }catch(error){

        console.error(
            "음악 저장소를 열 수 없습니다:",
            error
        );

    }
